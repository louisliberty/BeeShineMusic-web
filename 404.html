<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — BeeShine</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/images/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=DM+Sans:wght@400;500;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #F5D33A;
    --ink: #111111;
    --paper: #FFFDF4;
    --wing: #B9B8F5;
    --display: 'Bowlby One', sans-serif;
    --marker: 'Permanent Marker', cursive;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'DM Sans', system-ui, sans-serif;
    color: var(--ink);
    /* comic-book halftone dots on bee yellow */
    background-color: var(--accent);
    background-image: radial-gradient(rgba(17,17,17,.13) 1.6px, transparent 1.8px);
    background-size: 18px 18px;
    display: flex;
    flex-direction: column;
  }
  a { color: var(--ink); }

  header { background: var(--ink); border-bottom: 4px solid var(--ink); }
  header .wrap { max-width: 1240px; margin: 0 auto; padding: 10px 24px; }
  .brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; color: var(--paper); min-height: 44px; }
  .brand img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; background: #fff; }
  .brand span { font-family: var(--display); font-size: 22px; letter-spacing: 1px; }

  main { flex: 1; display: flex; align-items: center; }
  .stage {
    width: 100%; max-width: 1100px; margin: 0 auto; padding: 48px 24px 64px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 40px 64px;
  }

  /* The bee, with a scratched record spinning behind it */
  .art { position: relative; flex: 0 1 380px; aspect-ratio: 1 / 1; max-width: 380px; width: 100%; }
  .record {
    position: absolute; inset: -6%; border-radius: 50%;
    background:
      radial-gradient(circle at 50% 50%, var(--wing) 0 13%, var(--ink) 13.5% 15%, transparent 15.5%),
      repeating-radial-gradient(circle at 50% 50%, #1b1b1b 0 2px, #0c0c0c 2px 4px);
    border: 4px solid var(--ink);
    box-shadow: 10px 10px 0 rgba(17,17,17,.9);
    animation: spin 6s linear infinite;
  }
  .record::after { /* the scratch */
    content: ""; position: absolute; left: 20%; top: 28%; width: 34%; height: 4px;
    background: var(--paper); border-radius: 4px; transform: rotate(-24deg); opacity: .85;
  }
  .bee {
    position: absolute; inset: 9%; width: 82%; height: 82%;
    object-fit: cover; border-radius: 50%; border: 4px solid var(--ink); background: #fff;
    box-shadow: 6px 6px 0 var(--ink);
    animation: wobble 2.6s ease-in-out infinite;
  }
  .pow {
    position: absolute; right: -8%; top: -4%; z-index: 2;
    font-family: var(--display); font-size: 26px; color: var(--ink);
    background: var(--paper); border: 4px solid var(--ink); padding: 10px 14px 8px;
    transform: rotate(12deg);
    clip-path: polygon(0% 18%, 16% 14%, 12% 0%, 32% 10%, 46% 0%, 56% 12%, 76% 2%, 78% 18%, 100% 16%, 88% 36%, 100% 52%, 84% 62%, 96% 84%, 74% 80%, 70% 100%, 52% 86%, 36% 100%, 30% 82%, 8% 92%, 14% 70%, 0% 58%, 10% 42%);
    padding: 22px 26px 20px;
  }

  .copy { flex: 1 1 420px; max-width: 520px; display: flex; flex-direction: column; gap: 22px; }
  .big { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(96px, 18vw, 180px); line-height: .85; letter-spacing: -2px; text-shadow: 6px 6px 0 var(--paper); }

  /* Speech bubble from the bee */
  .bubble {
    position: relative; margin: 0; background: var(--paper); border: 4px solid var(--ink); border-radius: 22px;
    padding: 20px 24px; box-shadow: 6px 6px 0 var(--ink);
    font-family: var(--marker); font-size: clamp(22px, 3vw, 28px); line-height: 1.25;
  }
  .bubble::before, .bubble::after { content: ""; position: absolute; left: 34px; width: 0; height: 0; border-style: solid; }
  .bubble::before { top: -26px; border-width: 0 16px 26px 16px; border-color: transparent transparent var(--ink) transparent; }
  .bubble::after { top: -17px; left: 39px; border-width: 0 11px 19px 11px; border-color: transparent transparent var(--paper) transparent; }

  .sub { margin: 0; font-size: 18px; line-height: 1.5; }
  .actions { display: flex; flex-wrap: wrap; gap: 14px; padding-top: 4px; }
  .pill {
    display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 24px;
    border: 3px solid var(--ink); border-radius: 999px; font-weight: 700; font-size: 17px; text-decoration: none;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .pill:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--ink) !important; color: var(--ink); }
  .pill.primary { background: var(--ink); color: var(--paper); box-shadow: 4px 4px 0 var(--paper); }
  .pill.primary:hover { color: var(--paper); box-shadow: 7px 7px 0 var(--paper) !important; }
  .pill.secondary { background: var(--paper); color: var(--ink); box-shadow: 4px 4px 0 var(--ink); }

  footer { text-align: center; padding: 18px 24px 24px; font-size: 14px; }
  footer a { font-weight: 700; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes wobble { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg) translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) { .record, .bee { animation: none; } }

  @media (max-width: 700px) {
    .stage { padding-top: 40px; gap: 36px; }
    .art { max-width: 270px; }
    .pow { font-size: 20px; padding: 16px 20px 14px; }
    .copy { align-items: flex-start; }
    .actions { width: 100%; }
    .pill { flex: 1 1 100%; justify-content: center; }
  }
</style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brand" href="/"><img src="/images/logo.jpg" alt=""><span>BEESHINE</span></a>
    </div>
  </header>

  <main>
    <div class="stage">
      <div class="art" aria-hidden="true">
        <div class="record"></div>
        <img class="bee" src="/images/logo.jpg" alt="">
        <span class="pow">SKRRT!</span>
      </div>

      <div class="copy">
        <h1 class="big">404</h1>
        <p class="bubble">Whoa… this record skipped. That page ain't on the tracklist.</p>
        <div class="actions">
          <a class="pill primary" href="/">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>
            Back to the homepage
          </a>
          <a class="pill secondary" href="/#listen">Stream the music</a>
        </div>
      </div>
    </div>
  </main>

  <footer>
    Booking &amp; features: <a href="mailto:beeshinemusic@gmail.com">beeshinemusic@gmail.com</a>
  </footer>
</body>
</html>
